# shiroikuma-kakutoku fork identity + versioning.
# VERSION_NAME / VERSION_CODE track upstream Obtainium (pubspec.yaml "version: <name>+<code>").
# BUILD_NUMBER is our fork increment, bumped by build.sh on every build and reset to 1
# on each new upstream version (see the upstream-new-version skill).
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER, zero-padded to 3 digits: +015>";
# versionCode = VERSION_CODE * 10000 + BUILD_NUMBER   (Obtainium 2348 -> 23480000 + N).
VERSION_NAME=1.6.10
VERSION_CODE=2349
BUILD_NUMBER=36
APP_ID=shiroikuma.kakutoku
